<!DOCTYPE html>
<html>
<head>
    <title>SentimentScope – {{ keyword }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>SentimentScope</h1>

    <form action="/" method="post">
        <input type="text" name="keyword" placeholder="Nuova ricerca..." required>
        <button type="submit">Analizza</button>
    </form>

    <h2>Risultati per: "{{ keyword }}"</h2>
    <p>Post analizzati: {{ posts|length }}</p>

    <div class="chart-container" style="width: 300px; height: 300px;">
        <canvas id="sentimentChart"></canvas>
    </div>

    <table>
        <thead>
            <tr>
                <th>Titolo</th>
                <th>Subreddit</th>
                <th>Sentiment</th>
                <th>Score</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody>
            {% for post in posts %}
            <tr class="sentiment-{{ post.sentiment | lower }}">
                <td>{{ post.title }}</td>
                <td>r/{{ post.subreddit }}</td>
                <td>{{ post.sentiment }}</td>
                <td>{{ post.score }}</td>
                <td>{{ post.date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        const counts = {{ sentiment_counts | tojson }};
        const ctx = document.getElementById("sentimentChart").getContext("2d");
        new Chart(ctx, {
            type: "pie",
            data: {
                labels: ["Positivo", "Negativo", "Neutro"],
                datasets: [{
                    data: [counts.Positivo, counts.Negativo, counts.Neutro],
                    backgroundColor: ["#4caf50", "#f44336", "#9e9e9e"]
                }]
            },
            options: {
                responsive: false,
                plugins: {
                    legend: { position: "bottom" }
                }
            }
        });
    </script>
</body>
</html>
